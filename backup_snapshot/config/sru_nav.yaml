sru_nav_node:
  ros__parameters:
    depth_topic: /odin1/depth_img_competetion
    odom_topic: /odin1/odometry
    goal_topic: /goal_pose
    cancel_topic: /sru/cancel_navigation
    cmd_vel_topic: /sru/cmd_vel
    navigation_active_topic: /sru/navigation_active
    min_depth: 0.25
    max_depth: 10.0
    control_frequency: 5.0
    onnx_intra_op_threads: 1
    policy_scale: [0.20, 0.12, 0.35]
    arrival_distance: 0.50
    steering_drive_mode: true
    lateral_to_steering_gain: 0.80
    steering_max_angular: 0.35
    steering_min_speed_factor: 0.25
    steering_model_yaw_weight: 0.35

sru_twist_to_yhs:
  ros__parameters:
    cmd_vel_topic: /sru/safe_cmd_vel
    ctrl_cmd_topic: /ctrl_cmd
    max_linear_x: 0.20
    max_linear_y: 0.12
    max_angular_z: 0.35
    command_timeout: 0.50
    drive_gear: 6
    lateral_gear: 8
    lateral_activation_threshold: 0.02
    enable_lateral_gear: true
    gear_stop_cycles: 2
    gear_settle_cycles: 2

sru_pointcloud_safety:
  ros__parameters:
    cloud_topic: /odin1/cloud_raw
    cmd_vel_topic: /sru/cmd_vel
    navigation_active_topic: /sru/navigation_active
    odom_topic: /odin1/odometry
    safe_cmd_vel_topic: /sru/safe_cmd_vel
    obstacle_ahead_topic: /sru/obstacle_ahead
    # Odin center is 5 cm ahead of the vehicle center (base_link).
    odin_x: 0.05
    odin_y: 0.0
    odin_z: 0.8862
    odin_roll_deg: -1.0838
    odin_pitch_down_deg: 8.9642
    odin_yaw_deg: 0.0
    ground_clearance: 0.10
    obstacle_max_height: 1.50
    ground_fit_min_distance: 0.40
    ground_fit_max_distance: 4.00
    ground_fit_half_width: 1.50
    ground_fit_max_tilt_deg: 15.0
    ground_fit_inlier_distance: 0.04
    ground_fit_iterations: 20
    ground_fit_frequency: 2.0
    ground_plane_max_age: 0.75
    cloud_processing_frequency: 5.0
    max_cloud_points: 12000
    ground_fit_min_inliers: 300
    front_min_distance: 0.05
    # Try a drive-gear arc first; lateral mode is a close/failed-turn fallback.
    front_max_distance: 0.90
    front_half_width: 0.35
    side_min_distance: 0.20
    side_max_distance: 0.55
    side_half_length: 0.40
    minimum_obstacle_points: 20
    cloud_timeout: 0.75
    fail_safe_on_cloud_timeout: true
    diagnostics_log_frequency: 0.5
    enable_turn_avoidance: true
    avoidance_turn_speed: 0.06
    avoidance_turn_angular: 0.30
    avoidance_stop_distance: 0.28
    avoidance_full_speed_distance: 0.60
    forward_command_threshold: 0.01
    lateral_command_threshold: 0.02
    avoidance_direction_hold_time: 1.5
    avoidance_clear_margin_points: 5
    safety_control_frequency: 10.0
    raw_command_timeout: 0.60
    odom_timeout: 0.75
    front_clear_frames_required: 4
    side_clear_frames_required: 3
    obstacle_assert_frames: 2
    obstacle_clear_frames: 3
    recovery_ramp_time: 0.80
    avoidance_turn_timeout: 8.0
    turn_before_lateral_time: 2.5
    lateral_fallback_distance: 0.32
    mode_switch_pause: 0.20
    lateral_escape_speed: 0.06
    lateral_escape_min_distance: 0.18
    lateral_escape_max_distance: 0.45
    lateral_escape_timeout: 6.0
    avoidance_episode_timeout: 12.0
