<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Odin 坐标导航</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">ODIN NAVIGATION</p>
        <h1>坐标导航</h1>
      </div>
      <div class="connection" id="connection"><span></span><strong>正在连接</strong></div>
    </header>

    <section class="workspace">
      <div class="command-pane">
        <div class="section-heading">
          <h2>前往坐标</h2>
          <span id="frameLabel">odom</span>
        </div>
        <form id="goalForm">
          <div class="coordinate-grid">
            <label>X 坐标（米）<input id="xInput" name="x" type="number" step="0.1" min="-100" max="100" value="2.0" required></label>
            <label>Y 坐标（米）<input id="yInput" name="y" type="number" step="0.1" min="-100" max="100" value="0.0" required></label>
          </div>
          <div class="actions">
            <button class="primary" type="submit">发送目标</button>
            <button class="stop" id="stopButton" type="button"><span aria-hidden="true"></span>停止导航</button>
          </div>
        </form>

        <dl class="telemetry">
          <div><dt>当前位置</dt><dd id="positionValue">--</dd></div>
          <div><dt>目标距离</dt><dd id="distanceValue">--</dd></div>
          <div><dt>障碍状态</dt><dd id="obstacleValue">--</dd></div>
          <div><dt>安全速度</dt><dd id="velocityValue">--</dd></div>
        </dl>
      </div>

      <div class="map-pane">
        <div class="section-heading">
          <h2>路线规划</h2>
          <span id="targetState">未设置目标</span>
        </div>
        <div class="route-tools">
          <button id="drawRouteButton" type="button" aria-pressed="false">绘制路线</button>
          <button id="undoRouteButton" type="button" disabled>撤销</button>
          <button id="clearRouteButton" type="button" disabled>清空</button>
          <button id="zoomOutButton" class="icon-tool" type="button" title="缩小地图" aria-label="缩小地图">−</button>
          <button id="zoomInButton" class="icon-tool" type="button" title="放大地图" aria-label="放大地图">+</button>
          <button id="runRouteButton" class="primary" type="button" disabled>执行路线</button>
        </div>
        <canvas id="positionCanvas" width="720" height="520" aria-label="当前位置和目标位置图"></canvas>
        <p class="event" id="eventText">等待状态</p>
      </div>
    </section>
  </main>

  <dialog id="confirmDialog">
    <p class="eyebrow" id="confirmLabel">确认目标</p>
    <h2 id="confirmCoordinates">X 0.00 · Y 0.00</h2>
    <div class="dialog-actions">
      <button id="cancelConfirm" type="button">返回</button>
      <button id="confirmGoal" class="primary" type="button">确认前往</button>
    </div>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
